[pytest]
testpaths = tests

markers =
    slow: full 10,000-case runs. Minutes, not seconds, so they are opt-in.

# The default suite skips them. A suite people stop running is a suite that
# stops working, and RUN-8 was most of the wall time for none of the coverage.
#
#   pytest            fast suite, RUN-8 skipped
#   pytest -m slow    RUN-8 only
#   pytest -m ""      everything
#
# A command-line -m comes after addopts and wins, so both overrides work.
addopts = -m "not slow"
